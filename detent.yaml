schema: 1
# Keep machine-specific config in detent.local.yaml and local agent direction in WORKFLOW.local.md.
tracker:
  kind: github
  github_status_source: label
  repository: digitaldrywood/ghostreel
  status_label_prefix: "detent:"
  http_max_idle_conns: 100
  http_max_idle_conns_per_host: 32
  http_idle_conn_timeout_ms: 90000
  github_graphql_warn_remaining: 500
  github_graphql_min_remaining_reserve: 1000
  github_rest_min_remaining_reserve: 1000
  github_rest_fanout_max_requests: 80
  github_rest_debug_logging: false
  auto_provision: true
  active_states:
    - Todo
    - In Progress
    - Rework
    - Merging
  observed_states:
    - Backlog
    - Human Review
    - Blocked
  terminal_states:
    - Done
    - Cancelled
  state_map:
    Cancelled: Done
  priority_map:
    Urgent: 1
    High: 2
    Medium: 3
    Low: 4
    No priority: null
  dependency_auto_unblock:
    enabled: true
    source_states:
      - Blocked
    target_state: Todo
    readiness: terminal_or_merged
  blocked_recovery:
    enabled: false
    source_states:
      - Blocked
    target_state: Rework
    reason_codes:
      - merge_conflict
      - stale_base
      - missing_current_head_ci
  blocker_auto_promote:
    enabled: false
    blocker_states:
      - Backlog
      - Blocked
      - Human Review
    target_state: Todo
polling:
  interval_ms: 60000
  conditional: true
intake:
  sources: []
backlog_admission:
  enabled: true
  schedule: '*/15 * * * *'
  auto_admit: true
  auto_admit_min_confidence: 0.85
  sources:
    states:
      - Backlog
  target_state: Todo
  criteria_section: Admission Criteria
  authors:
    allow:
      - corylanou
      - loganlanou
      - michaelhvisser
      - jarvislanou
  max_proposals_per_run: 3
  max_open_proposals: 10
  max_candidates_per_run: 50
  proposal_expiry_days: 7
workspace:
  # NOTE: this repository is public. Machine-specific absolute paths
  # (workspace.root, workspace.source_root) live in the gitignored
  # detent.local.yaml so this shared contract stays portable and leaks no
  # operator home directory layout.
  cache_strategy: isolated
  auto_branch: true
  cleanup_idle_ttl_ms: 86400000
  cleanup_sweep_interval_ms: 600000
deliverable:
  merge_method: squash
agent:
  max_concurrent_agents: 3
  max_turns: 20
  max_retry_backoff_ms: 300000
  overload_retry_delay_ms: 45000
  no_progress_spend_limit_usd: 3
  resume_orphaned_sessions: true
  # No per-session token ceiling. Billing is subscription-based, so a token cap
  # buys nothing and only kills near-complete sessions. Runaway protection comes
  # from no_progress_spend_limit_usd, max_turns, no-progress parking, and
  # provider capacity pauses instead. Leave max_session_tokens unset
  # (0 = disabled). Do not reintroduce it.
  max_concurrent_agents_by_state:
    Merging: 1
  dispatch_priority_by_state:
    - Merging
    - Rework
    - In Progress
    - Todo
  dispatch_priority_by_label:
    - bug
    - enhancement
    - documentation
  prioritize_unblockers: true
  auto_promote:
    enabled: true
    quiet_seconds: 0
    # This repository-level label must exist; operators apply it as the per-issue brake.
    optout_label: requires-human-review
    allowed_issue_labels: []
    gate_wait_state: source
    gate_wait_timeout_seconds: 3600
    source_state: Human Review
    pass_state: Merging
    rework_state: Rework
    rework_limit: 3
  skills:
    enabled: true
    path: .detent/skills
    max_skills_in_prompt: 50
    creation:
      enabled: true
      max_drafts_per_run: 1
codex:
  command: codex app-server # Provider default: upgrades automatically and avoids retirement breakage.
  approval_policy: never
  thread_sandbox: workspace-write
  turn_sandbox_policy:
    type: workspaceWrite
    networkAccess: true
gate:
  kind: command
  # This command is the local counterpart of .github/workflows/ci.yml. It runs
  # without API keys, network, or the 326MB Kokoro model: Python syntax across
  # src/, shell syntax on every script, ESM parse of the Playwright recorder,
  # JSON validity of every example intake/scenes file, and the stdlib unittest
  # suite under tests/.
  #
  # It is deliberately cheap. The real end-to-end signal is the free rough cut
  # (`./ghostreel.sh --rough`), which WORKFLOW.md requires by hand for any change
  # touching the pipeline, beat schema, TTS, or cue sync — it needs Kokoro,
  # Playwright Chromium and ImageMagick, so it is not run on every PR.
  #
  # The tests/ suite uses stdlib unittest, so it needs no pytest or additional
  # dependency. The directory guard keeps the shared command compatible with
  # older branches that predate the suite.
  #
  # Narration-specific linting runs inside src/run.sh and has unit coverage in
  # tests/test_lint_script.py; this repository-wide gate exercises that suite.
  run: sh -c 'set -e; python3 -m compileall -q src; for f in ghostreel.sh src/*.sh; do bash -n "$f"; done; node --check src/record_html.mjs; for f in examples/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done; if [ -d tests ]; then python3 -m unittest discover -s tests; fi'
  require_automated_review: false
  # `CI` is the job name in .github/workflows/ci.yml, which mirrors gate.run
  # above step for step. Naming it explicitly is what makes the promotion gate
  # legible: before this workflow existed the repo had no checks at all, GitHub
  # reported every PR head as status "pending" rather than "success", and
  # auto-promote parked every finished issue forever with `ci_not_green`.
  required_status_checks:
    - CI
  ci_failure_action: rework
  transient_ci_retry_limit: 2
  # Left off: the deterministic CI and unit-test gate does not need a separate
  # model-scored validator. Enable it only if the project adopts a review signal
  # that benefits from an additional validator verdict.
  validator:
    enabled: false
plan:
  enabled: false
  review: human
  approval_label: plan-approved
  stop: "Plan Review"
server:
  host: 127.0.0.1
  port: 4000
  kanban:
    mode: integration
budget:
  # Disabled to match every other project on this host: the fleet runs on a flat
  # Codex subscription, so USD caps are notional and park healthy work. Real
  # brakes remain: no-progress parking, max_turns, capacity pauses.
  # billing_mode stays `metered` even though caps are off: it is what keeps
  # agent.no_progress_spend_limit_usd an enforced brake that parks a runaway
  # session, rather than advisory telemetry. Doctor's "inert budget" warning on
  # this block is cosmetic and accepted.
  billing_mode: metered
  enabled: false
hooks:
  timeout_ms: 60000
